[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-notes-sync"
version = "0.1.0"
description = "Collect your AI assistants' notes into one Git-backed Basic Memory vault and record which app, model and setting made each edit."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mario Marcolongo" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "mcp", "basic-memory", "obsidian", "git", "provenance", "claude", "codex"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ai-notes-sync = "ai_notes_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
